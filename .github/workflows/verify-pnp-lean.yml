name: Verify PNP Lean semantics and independent checker

'on':
  push:
    branches: [palomar-compatibility]
    paths:
      - 'verification/tryx-lean/**'
      - 'review/**'
      - '.github/workflows/verify-pnp-lean.yml'
  pull_request:
    paths:
      - 'verification/tryx-lean/**'
      - 'review/**'
      - '.github/workflows/verify-pnp-lean.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pnp-lean-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - &checkout
        name: Checkout PNP review project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare verification logs
        run: mkdir -p verification-logs

      - &lean
        name: Install pinned Lean toolchain
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.35.0-rc2
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" +leanprover/lean4:v4.35.0-rc2 --version | tee verification-logs/lean-version.log

      - name: Regenerate dependency manifest
        working-directory: verification/tryx-lean
        run: |
          lake update
          cp lake-manifest.json "$GITHUB_WORKSPACE/verification-logs/lake-manifest.json"

      - &deps
        name: Fetch and verify pinned dependencies
        working-directory: verification/tryx-lean
        run: |
          sha256sum lake-manifest.json > "$GITHUB_WORKSPACE/verification-logs/manifest-before.sha256"
          lake exe cache get 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/dependencies.log"
          sha256sum --check "$GITHUB_WORKSPACE/verification-logs/manifest-before.sha256"
          python3 - <<'CHECK'
          import json, subprocess
          from pathlib import Path
          for p in json.loads(Path('lake-manifest.json').read_text())['packages']:
              actual = subprocess.check_output(
                  ['git', '-C', str(Path('.lake/packages') / p['name']), 'rev-parse', 'HEAD'],
                  text=True
              ).strip()
              assert actual == p['rev'], (p['name'], actual, p['rev'])
              print(p['name'], actual)
          CHECK

      - name: Audit solution and MATHIC source
        working-directory: verification/tryx-lean
        run: |
          python3 - <<'CHECK'
          import re
          from pathlib import Path
          for name in ['TryxProof.lean', 'TryxMathic.lean']:
              source = Path(name).read_text()
              assert not re.search(r'\b(sorry|admit)\b|^\s*(public\s+)?axiom\b', source, re.M), name
          CHECK

      - name: Build accepted proof and MATHIC projects
        working-directory: verification/tryx-lean
        run: |
          lake build TryxProof TryxMathic 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/build.log"

      - name: Print proof theorem axioms
        working-directory: verification/tryx-lean
        run: |
          lake env lean TryxProof.lean 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/axioms-proof.log"

      - name: Compile MATHIC bridge and print theorem axioms
        working-directory: verification/tryx-lean
        run: |
          lake env lean TryxMathic.lean 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/axioms-mathic.log"

      - name: Preserve regenerated dependency manifest
        uses: actions/upload-artifact@v4
        with:
          name: pnp-migrated-manifest
          path: verification-logs/lake-manifest.json
          if-no-files-found: error

      - &logs
        name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnp-lean-${{ github.run_id }}-${{ github.job }}
          path: verification-logs/
          retention-days: 30

  independent:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - *checkout

      - name: Prepare verification logs
        run: mkdir -p verification-logs

      - *lean

      - name: Retrieve verified dependency manifest
        uses: actions/download-artifact@v4
        with:
          name: pnp-migrated-manifest
          path: verification-logs

      - name: Restore identical dependency revisions
        working-directory: verification/tryx-lean
        run: |
          cp "$GITHUB_WORKSPACE/verification-logs/lake-manifest.json" lake-manifest.json

      - *deps

      - name: Build independent checking tools
        working-directory: verification/tryx-lean
        run: |
          lake build comparator lean4export 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/checker-build.log"
          git clone https://github.com/Zouuup/landrun.git "$RUNNER_TEMP/landrun"
          git -C "$RUNNER_TEMP/landrun" checkout --detach 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          (cd "$RUNNER_TEMP/landrun" && go build -o "$RUNNER_TEMP/landrun-bin" ./cmd/landrun)
          git clone https://github.com/ammkrn/nanoda_lib.git "$RUNNER_TEMP/nanoda"
          git -C "$RUNNER_TEMP/nanoda" checkout --detach 4c544ed4099c8227f07d5de77ad1e69fb0740a27
          (cd "$RUNNER_TEMP/nanoda" && cargo build --release --locked) 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/nanoda-build.log"
          test ! -e .lake/build/lib/lean/TryxProof.olean
          test ! -e .lake/build/lib/lean/TryxMathic.olean

      - name: Independent Comparator and NanoDa check
        working-directory: verification/tryx-lean
        run: |
          test "$(id -u)" -ne 0
          export COMPARATOR_LANDRUN="$RUNNER_TEMP/landrun-bin"
          export COMPARATOR_LEAN4EXPORT="$GITHUB_WORKSPACE/verification/tryx-lean/.lake/packages/lean4export/.lake/build/bin/lean4export"
          export COMPARATOR_NANODA="$RUNNER_TEMP/nanoda/target/release/nanoda_bin"
          test -x "$COMPARATOR_LEAN4EXPORT"
          test -x "$COMPARATOR_NANODA"
          systemd-run --user --wait --pipe --collect \
            --property=RestrictAddressFamilies=~AF_UNIX \
            --working-directory="$PWD" \
            --setenv=PATH="$PATH" \
            --setenv=HOME="$HOME" \
            --setenv=COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
            --setenv=COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
            --setenv=COMPARATOR_NANODA="$COMPARATOR_NANODA" \
            lake exe comparator comparator.json \
            2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/comparator.log"

      - *logs
          --setenv=COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
          --setenv=COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
          --setenv=COMPARATOR_NANODA="$COMPARATOR_NANODA" \
          lake exe comparator comparator.json \
          2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/comparator.log"
    - *logs
