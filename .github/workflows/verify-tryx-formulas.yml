name: Historical TRYX mixed proof project (manual)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: historical-tryx-formulas-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - &checkout
      name: Checkout preserved project
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Prepare formula project and pin record
      run: |
        mkdir -p verification-logs
        cd verification/tryx-lean
        sha256sum lake-manifest.json > "$GITHUB_WORKSPACE/verification-logs/manifest-before.sha256"
    - &lean
      name: Install pinned Lean toolchain
      run: |
        curl --fail --location --retry 3 https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
        sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.34.0-rc2
        printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
        "$HOME/.elan/bin/lean" +leanprover/lean4:v4.34.0-rc2 --version | tee verification-logs/lean-version.log
    - &deps
      name: Fetch pinned dependencies and Mathlib cache
      working-directory: verification/tryx-lean
      run: |
        lake exe cache get 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/dependencies.log"
        sha256sum --check "$GITHUB_WORKSPACE/verification-logs/manifest-before.sha256"
        python3 - <<'CHECK'
        import json, subprocess
        from pathlib import Path
        for p in json.loads(Path('lake-manifest.json').read_text())['packages']:
            actual = subprocess.check_output(
                ['git', '-C', str(Path('.lake/packages') / p['name']), 'rev-parse', 'HEAD'],
                text=True
            ).strip()
            assert actual == p['rev'], (p['name'], actual, p['rev'])
            print(p['name'], actual)
        CHECK
    - name: Build preserved TRYX proof project
      working-directory: verification/tryx-lean
      run: lake build TryxProof 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/build.log"
    - name: Print theorem axioms
      working-directory: verification/tryx-lean
      run: lake env lean TryxProof.lean 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/axioms.log"
    - &logs
      name: Preserve verification logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: historical-tryx-formulas-${{ github.run_id }}-${{ github.job }}
        path: verification-logs/
        retention-days: 30
  independent:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - *checkout
    - name: Prepare formula project and pin record
      run: |
        mkdir -p verification-logs
        cd verification/tryx-lean
        sha256sum lake-manifest.json > "$GITHUB_WORKSPACE/verification-logs/manifest-before.sha256"
    - *lean
    - *deps
    - name: Build checking tools without building the solution
      working-directory: verification/tryx-lean
      run: |
        lake build comparator lean4export 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/checker-build.log"
        git clone https://github.com/Zouuup/landrun.git "$RUNNER_TEMP/landrun"
        git -C "$RUNNER_TEMP/landrun" checkout --detach 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
        (cd "$RUNNER_TEMP/landrun" && go build -o "$RUNNER_TEMP/landrun-bin" ./cmd/landrun)
        git clone https://github.com/ammkrn/nanoda_lib.git "$RUNNER_TEMP/nanoda"
        git -C "$RUNNER_TEMP/nanoda" checkout --detach 4c544ed4099c8227f07d5de77ad1e69fb0740a27
        (cd "$RUNNER_TEMP/nanoda" && cargo build --release --locked) 2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/nanoda-build.log"
        ! test -e .lake/build/lib/lean/TryxProof.olean
    - name: Independent Comparator and nanoda check
      working-directory: verification/tryx-lean
      run: |
        test "$(id -u)" -ne 0
        export COMPARATOR_LANDRUN="$RUNNER_TEMP/landrun-bin"
        export COMPARATOR_LEAN4EXPORT="$GITHUB_WORKSPACE/verification/tryx-lean/.lake/packages/lean4export/.lake/build/bin/lean4export"
        export COMPARATOR_NANODA="$RUNNER_TEMP/nanoda/target/release/nanoda_bin"
        test -x "$COMPARATOR_LEAN4EXPORT"
        test -x "$COMPARATOR_NANODA"
        systemd-run --user --wait --pipe --collect \
          --property=RestrictAddressFamilies=~AF_UNIX \
          --working-directory="$PWD" \
          --setenv=PATH="$PATH" \
          --setenv=HOME="$HOME" \
          --setenv=COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
          --setenv=COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
          --setenv=COMPARATOR_NANODA="$COMPARATOR_NANODA" \
          lake exe comparator comparator.json \
          2>&1 | tee "$GITHUB_WORKSPACE/verification-logs/comparator.log"
    - *logs
